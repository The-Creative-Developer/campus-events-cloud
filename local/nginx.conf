# Mirrors the CloudFront setup in AWS: one domain, two "behaviours".
#   /api/*  -> forwarded to the backend (API Gateway + Lambda in AWS)
#   /*      -> static files (S3 in AWS)
# Same-origin means the browser never needs CORS.
server {
    listen 80;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
